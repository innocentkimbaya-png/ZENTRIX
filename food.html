<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENTRIX - Menu Finder</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial;background:#F2F4F7;color:#0F1B2D}
.top{position:sticky;top:0;z-index:20;display:flex;gap:10px;padding:12px;align-items:center;background:rgba(255,255,255,.97);border-bottom:1px solid #E5E9EF}
.logo{font-weight:900;font-size:22px;color:#0F1B2D}.logo i{color:#00A651;font-style:normal}
.search{flex:1;background:#EEF1F4;border-radius:99px;padding:9px 12px;display:flex;gap:8px;align-items:center}
.search input{border:0;outline:0;width:100%;background:transparent;color:#0F1B2D}
.search input::placeholder{color:#8A94A6}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px}.cat{white-space:nowrap;padding:9px 16px;border-radius:99px;background:#fff;border:1px solid #E5E9EF;font-size:13px;font-weight:700;cursor:pointer}.cat.on{background:#0F1B2D;color:#fff}
.hero{margin:0 12px 12px;background:linear-gradient(135deg,#0F1B2D,#143A2E);border-radius:20px;padding:20px;color:#fff;box-shadow:0 10px 25px rgba(15,27,45,.15)}
.hero h2{font-size:22px}.hero p{font-size:13px;opacity:.85;margin:8px 0 12px}.hero button{background:#FFB800;color:#0F1B2D;border:0;padding:11px 16px;border-radius:99px;font-weight:800}
.card{background:#fff;border:1px solid #E5E9EF;border-radius:18px;margin:0 12px 12px;overflow:hidden;box-shadow:0 2px 12px rgba(15,27,45,.06)}
.card img{width:100%;height:150px;object-fit:cover;background:#eee}
.pad{padding:12px}
.price{font-weight:900;font-size:16px;color:#0F1B2D}
.wa{display:block;text-align:center;background:#25D366;color:#fff;padding:10px;border-radius:99px;font-weight:800;font-size:13px;text-decoration:none;margin-top:10px}
.menuItem{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #E5E9EF;font-size:13px}
.menuItem:last-child{border:0}
.upload{background:#fff;border-radius:18px;padding:16px;margin:12px;display:none;border:1px solid #E5E9EF}
.upload input,.upload select{width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;margin-top:8px}
.btn{border:0;padding:12px;border-radius:12px;font-weight:800;width:100%}.btnP{background:#00A651;color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:12px 0 14px;border-top:1px solid #E5E9EF;z-index:20}
.bottom span{text-align:center;font-size:11px;color:#8A94A6;font-weight:700}.bottom span.on{color:#0F1B2D}
</style></head><body>
<div class="top"><div class="logo">ZENTRIX<i>.</i></div><div class="search">🔍<input id="sIn" placeholder="Search food, restaurant, e.g. Shawarma..." oninput="render()"></div></div>
<div class="cats" id="cats"></div>
<div class="hero"><h2>🍔 Browse Menu Finder</h2><p>Find restaurants in Kitwe & Ndola. See menu, prices & location. Order on WhatsApp.</p><button onclick="openAdd()">+ Add Your Restaurant</button></div>
<div class="upload" id="addBox">
<b>Add Restaurant & Menu</b>
<input id="rName" placeholder="Restaurant name, e.g. Mama's Kitchen">
<input id="rLoc" placeholder="Location, e.g. Kitwe Town Centre">
<input id="rWa" placeholder="WhatsApp number, e.g. Enter phone number">
<input id="rMenu" placeholder="Menu - e.g. Shawarma K80, Chips K50, Burger K70">
<input type="file" id="rImg" accept="image/*" onchange="onImg(this)">
<img id="rPrev" style="width:100%;border-radius:12px;display:none;margin-top:8px">
<button class="btn btnP" style="margin-top:10px" onclick="doAdd()">Add Restaurant - FREE</button>
<button class="btn" style="background:#eee;margin-top:8px" onclick="openAdd()">Cancel</button>
</div>
<h3 style="padding:0 12px 10px">📍 Restaurants Near You</h3>
<div id="list" style="padding-bottom:90px"></div>
<div class="bottom"><span onclick="location.href='home.html'">🏠<br>Home</span><span onclick="location.href='market.html'">🛒<br>Market</span><span class="on">🍔<br>Food</span><span onclick="location.href='watch.html'">▶️<br>Watch</span><span onclick="location.href='home.html'">👤<br>Profile</span></div>
<script>
let CATS=['All','Fast Food','Local Food','Pizza & Grill','Shawarma','Drinks & Snacks'];
let curCat='All'; let tmpImg='';
function getR(){ try{return JSON.parse(localStorage.getItem('zentrix_food')||'[]')}catch(e){return[]} }
function saveR(r){ localStorage.setItem('zentrix_food',JSON.stringify(r)); }
function renderCats(){ document.getElementById('cats').innerHTML=CATS.map(c=>'<div class="cat '+(c==curCat?'on':'')+'" onclick="setCat(\''+c+'\')">'+c+'</div>').join(''); }
function setCat(c){ curCat=c; renderCats(); render(); }
function openAdd(){
  let b=document.getElementById('addBox');
  let isOpen=b.style.display=='block';
  if(isOpen){ b.style.display='none'; return; }
  b.style.display='block';
  b.style.border='2px solid #00A651';
  b.style.boxShadow='0 0 0 4px rgba(0,166,81,.15)';
  setTimeout(()=>{ b.scrollIntoView({behavior:'smooth',block:'start'}); document.getElementById('rName').focus(); },100);
  setTimeout(()=>{ b.style.border='1px solid #E5E9EF'; b.style.boxShadow='none'; },2500);
}
function onImg(i){ let f=i.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{ tmpImg=e.target.result; let im=document.getElementById('rPrev'); im.src=tmpImg; im.style.display='block'; }; r.readAsDataURL(f); }
function doAdd(){
 let name=document.getElementById('rName').value.trim(); let loc=document.getElementById('rLoc').value.trim(); let wa=document.getElementById('rWa').value.trim(); let menu=document.getElementById('rMenu').value.trim();
 if(!name){ alert('Enter restaurant name'); return; }
 if(!loc){ alert('Enter location'); return; }
 if(!wa){ alert('Enter WhatsApp number'); return; }
 if(!menu){ alert('Enter at least one menu item with price, e.g. Shawarma K80'); return; }
 let cleanWa=wa.replace(/[^0-9]/g,''); if(cleanWa.startsWith('0')) cleanWa='260'+cleanWa.slice(1);
 let list=getR(); list.unshift({name:name,loc:loc,wa:cleanWa,menu:menu,img:tmpImg,cat:'Local Food',rating:'4.8'});
 saveR(list); alert('✅ Restaurant added!'); document.getElementById('rName').value=''; document.getElementById('rLoc').value=''; document.getElementById('rWa').value=''; document.getElementById('rMenu').value=''; tmpImg=''; openAdd(); render();
}
function render(){
 renderCats(); let list=getR(); let q=(document.getElementById('sIn').value||'').toLowerCase();
 if(curCat!='All') list=list.filter(r=>(r.cat||'').toLowerCase().includes(curCat.toLowerCase())||(r.menu||'').toLowerCase().includes(curCat.toLowerCase()));
 if(q) list=list.filter(r=>(r.name+' '+r.loc+' '+r.menu).toLowerCase().includes(q));
 let el=document.getElementById('list');
 if(list.length==0){
   el.innerHTML='<div style="background:#fff;border:1px dashed #ddd;border-radius:18px;padding:30px 20px;text-align:center;margin:0 12px"><div style="font-size:50px">🍔</div><h3 style="margin:12px 0 6px">No restaurants yet in '+curCat+'</h3><p style="color:#8A94A6;font-size:13px;line-height:1.6">Nobody has added a restaurant yet.<br>Be the first in Kitwe!</p><button onclick="openAdd()" style="margin-top:16px;background:#00A651;color:#fff;border:0;padding:12px 22px;border-radius:99px;font-weight:800">+ Add First Restaurant</button><p style="font-size:11px;color:#999;margin-top:14px">Demo tip: Add Mama\\'s Kitchen - Kitwe Town - Shawarma K80</p></div>';
   return;
 }
 el.innerHTML=list.map(r=>{
   let img=r.img?r.img:'https://via.placeholder.com/600x300?text='+encodeURIComponent(r.name);
   let items=r.menu.split(',').map(m=>{ let parts=m.trim().split(' K'); return '<div class="menuItem"><span>'+(parts[0]||m)+'</span><b>'+(parts[1]?'K'+parts[1]:'')+'</b></div>'; }).join('');
   let msg=encodeURIComponent('Hi '+r.name+'! I saw your menu on ZENTRIX. I want to order: ');
   return '<div class="card"><img src="'+img+'"><div class="pad"><div style="display:flex;justify-content:space-between"><b>'+r.name+'</b><span style="background:#E6F6EE;color:#00A651;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800">⭐ '+r.rating+'</span></div><div style="font-size:12px;color:#8A94A6;margin:4px 0">📍 '+r.loc+' • 🕒 Open Now</div><div style="margin-top:8px"><b style="font-size:13px">Menu</b>'+items+'</div><a class="wa" href="https://wa.me/'+r.wa+'?text='+msg+'" target="_blank">💬 Order on WhatsApp</a></div></div>';
 }).join('');
}
render();
</script><script>
var M={home:'index.html',messages:'messages.html',msg:'messages.html',watch:'watch.html',market:'market.html',shop:'market.html',food:'food.html',tickets:'ticket.html',ticket:'ticket.html',suppliers:'suppliers.html'};
document.addEventListener('click',function(e){
 var t=e.target.closest('a,button,div,span');
 if(!t) return;
 var txt=t.textContent.trim().toLowerCase();
 for(var k in M){ if(txt===k){ e.preventDefault(); e.stopPropagation(); location.href=M[k]; return; } }
},true);
window.alert=function(m){ if(String(m).includes('coming soon')) return; };
</script></body></html>
