<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ZENTRIX - Log In</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#00a88f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.box{background:#fff;width:100%;max-width:420px;border-radius:22px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}.logo{font-size:38px;font-weight:900;color:#00a88f}.logo i{color:#000}.sub{color:#666;margin:6px 0 20px}.tabs{display:flex;background:#f0f0f0;border-radius:25px;padding:4px;margin-bottom:18px}.tabs button{flex:1;border:0;padding:11px;border-radius:20px;font-weight:800;background:transparent}.tabs button.on{background:#00a88f;color:#fff}.inp{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;margin-bottom:12px;font-size:16px;outline:none}.inp:focus{border-color:#00a88f}.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:4px 0 14px;color:#666}.row a{color:#00a88f;text-decoration:none;font-weight:700}.big{width:100%;background:#00a88f;color:#fff;border:0;padding:15px;border-radius:25px;font-weight:800;font-size:17px}.or{margin:16px 0;color:#999;font-size:14px}.guest{width:100%;background:#111;color:#fff;border:0;padding:13px;border-radius:25px;font-weight:800}.small{font-size:13px;color:#999;margin-top:14px;line-height:1.5}.pic{width:80px;height:80px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 10px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.hide{display:none}</style></head><body>
<div class='box'><div class='logo'>ZENTRIX<i>.</i></div><p class='sub' id='subtitle'>Welcome back. Log in to continue.</p>
<div class='pic' id='loginPic'>?</div>
<div class='tabs'><button id='tabLogin' class='on' onclick='showTab("login")'>Log In</button><button id='tabSignup' onclick='showTab("signup")'>Create Account</button></div>
<div id='loginForm'><input class='inp' id='loginName' placeholder='Your name or email'><input class='inp' id='loginPass' type='password' placeholder='Password'><div class='row'><label><input type='checkbox' checked> Remember me</label><a href='#' onclick='alert("Ask admin to reset your password");return false'>Forgot password?</a></div><button class='big' onclick='doLogin()'>Log In →</button></div>
<div id='signupForm' class='hide'><input class='inp' id='suName' placeholder='Full name - e.g. Boones'><input class='inp' id='suEmail' placeholder='Email or phone'><input class='inp' id='suPass' type='password' placeholder='Create password (4+ chars)'><input class='inp' id='suPass2' type='password' placeholder='Confirm password'><button onclick="document.getElementById('suPic').click()" style='width:100%;background:#f0f0f0;border:0;padding:12px;border-radius:20px;font-weight:800;margin-bottom:12px'>📷 Add Profile Photo (optional)</button><input type='file' id='suPic' accept='image/*' style='display:none'><button class='big' onclick='doSignup()'>Create Account →</button></div>
<div class='or'>— OR —</div><button class='guest' onclick='guestLogin()'>Continue as Guest</button><p class='small'>By continuing you agree to ZENTRIX terms.<br>Your account is saved on this phone.</p></div>
<script>
function showTab(t){document.getElementById('loginForm').classList.toggle('hide',t!=='login');document.getElementById('signupForm').classList.toggle('hide',t!=='signup');document.getElementById('tabLogin').classList.toggle('on',t==='login');document.getElementById('tabSignup').classList.toggle('on',t==='signup');document.getElementById('subtitle').textContent=t==='login'?'Welcome back. Log in to continue.':'Create your ZENTRIX account.'}
var tmpPic='';
document.getElementById('suPic').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){tmpPic=e.target.result;document.getElementById('loginPic').innerHTML='<img src="'+tmpPic+'">'};r.readAsDataURL(f)});
function doSignup(){var n=document.getElementById('suName').value.trim();var e=document.getElementById('suEmail').value.trim();var p=document.getElementById('suPass').value;var p2=document.getElementById('suPass2').value;if(!n){alert('Type your full name');return}if(p.length<4){alert('Password must be 4+ characters');return}if(p!==p2){alert('Passwords do not match');return}localStorage.setItem('zentrix_name',n);localStorage.setItem('zentrix_email',e);localStorage.setItem('zentrix_pass',p);localStorage.setItem('zentrix_bio',e||'');if(tmpPic)localStorage.setItem('zentrix_pic',tmpPic);localStorage.setItem('zentrix_logged_in','1');alert('Welcome to ZENTRIX, '+n+'!');location.href='home.html'}
function doLogin(){var n=document.getElementById('loginName').value.trim();var p=document.getElementById('loginPass').value;var savedName=localStorage.getItem('zentrix_name')||'';var savedEmail=localStorage.getItem('zentrix_email')||'';var savedPass=localStorage.getItem('zentrix_pass')||'';if(!n){alert('Type your name or email');return}if(savedPass&&p!==savedPass){alert('Wrong password. Try again or tap Create Account.');return}if(savedName&&(n===savedName||n===savedEmail)){localStorage.setItem('zentrix_logged_in','1');location.href='home.html';return}if(!savedName){if(!p){alert('No account found. Please Create Account first.');showTab('signup');return}localStorage.setItem('zentrix_name',n);localStorage.setItem('zentrix_pass',p);localStorage.setItem('zentrix_logged_in','1');location.href='home.html';return}localStorage.setItem('zentrix_logged_in','1');location.href='home.html'}
function guestLogin(){localStorage.setItem('zentrix_logged_in','guest');location.href='home.html'}
var savedPic=localStorage.getItem('zentrix_pic');if(savedPic){document.getElementById('loginPic').innerHTML='<img src="'+savedPic+'">'}var savedName2=localStorage.getItem('zentrix_name');if(savedName2){document.getElementById('loginName').value=savedName2;document.getElementById('loginPic').innerHTML=savedPic?'<img src="'+savedPic+'">':savedName2.charAt(0).toUpperCase()}
</script></body></html>
